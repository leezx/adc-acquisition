[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adc-acquisition"
version = "0.1.0"
description = "Source-separated raw evidence acquisition pipeline for an ADC knowledgebase."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "PyYAML>=6.0,<7",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[project.scripts]
adc-acquisition = "adc_acquisition.__main__:main"

[tool.setuptools.packages.find]
include = ["adc_acquisition*", "jobs*"]
