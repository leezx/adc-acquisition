# Source registry — one entry per external evidence source.
#
# implementation_status: not_started | investigated | implemented | paused
# acquisition_method: api | bulk_download | scrape | manual
#
# This file is the single source of truth for "what sources exist and how
# far along is each one." Update `implementation_status` as work proceeds.
# Do not delete entries for sources that turn out to be infeasible — mark
# them `paused` and record why in `notes`.

pubmed:
  source_type: literature
  authority: primary_index
  official_url: https://pubmed.ncbi.nlm.nih.gov/
  api_docs_url: https://www.ncbi.nlm.nih.gov/books/NBK25501/
  acquisition_method: api
  authentication_required: false
  auth_notes: Optional NCBI_API_KEY raises rate limit from 3 req/s to 10 req/s.
  rate_limit: "3 req/s (10 req/s with api_key)"
  license_or_access_note: Public metadata via NCBI E-utilities; abstracts are metadata, not full text.
  raw_formats: [xml]
  update_strategy: incremental_by_esearch_date_range
  implementation_status: implemented
  enabled: true
  notes: Job 01. Implemented first per Prompt.md recommended execution order.

europe_pmc:
  source_type: literature
  authority: secondary_index
  official_url: https://europepmc.org/
  api_docs_url: https://europepmc.org/RestfulWebService
  acquisition_method: api
  authentication_required: false
  rate_limit: "no official published limit; ~10 req/s commonly cited by users on the EBI developer forum, we use 5 req/s"
  license_or_access_note: Mixed; only open-access full text (isOpenAccess=Y) may be downloaded, never publisher paywalls.
  raw_formats: [json, xml]
  update_strategy: content_hash_diff_no_date_cursor_yet
  implementation_status: implemented
  enabled: true
  notes: Job 02. Metadata via search (cursorMark pagination). Open-access full text (fullTextXML) is a separate, independently versioned artifact (europe_pmc_fulltext.parquet, parent_record_id linking back), not a field on the metadata row. No PubMed dedup — both sources retain independent evidence per Prompt.md section 6.

clinicaltrials_gov:
  source_type: clinical_registry
  authority: primary_registry
  official_url: https://clinicaltrials.gov/
  api_docs_url: https://clinicaltrials.gov/data-api/api
  acquisition_method: api
  authentication_required: false
  rate_limit: "no official published limit; ~50 req/min (~0.83 req/s) commonly cited by third-party users, we use 0.7 req/s"
  license_or_access_note: Public domain.
  raw_formats: [json]
  update_strategy: incremental_by_last_update_date (AREA[LastUpdatePostDate]RANGE filter)
  implementation_status: implemented
  enabled: true
  notes: Job 06 in Prompt.md, promoted to #3 in recommended execution order. Search results already contain the complete trial record inline (no separate fetch phase, unlike PubMed/Europe PMC). Known-asset lookup capability implemented (--intervention "<name>") per Prompt.md section 10.B, not yet wired into a systematic expansion pass (Job 15).

crossref:
  source_type: literature
  authority: doi_registration_agency
  official_url: https://www.crossref.org/
  api_docs_url: https://api.crossref.org/swagger-ui/index.html
  acquisition_method: api
  authentication_required: false
  rate_limit: "dynamic via response headers (observed live: 10 req/s, concurrency 3); we use a conservative static 5 req/s"
  license_or_access_note: Public metadata.
  raw_formats: [json]
  update_strategy: doi_centric_reconciliation_not_date_range
  implementation_status: implemented
  enabled: true
  notes: >
    Job 12 in Prompt.md, promoted to #4 in recommended execution order.
    NOT a broad discovery source: query.bibliographic/query.title are
    relevance-ranked free text, not phrase/boolean search (verified live —
    query.title="antibody-drug conjugate" returned 860,937 hits). Instead
    reconciles DOIs already discovered by PubMed/Europe PMC via the
    authoritative GET /works/{doi} endpoint (configs/crossref_reconciliation_sources.yaml),
    plus an ad hoc --doi "<doi>" lookup mode.

sec:
  source_type: corporate_regulatory
  authority: primary
  official_url: https://www.sec.gov/edgar
  api_docs_url: https://www.sec.gov/edgar/sec-api-documentation
  acquisition_method: api
  authentication_required: false
  rate_limit: "10 req/s max (officially documented), mandatory identifying User-Agent or HTTP 403 + brief IP block; we use 8 req/s"
  license_or_access_note: Public filings.
  raw_formats: [html, txt, xml, xbrl]
  update_strategy: company_centric_full_filing_history_per_run
  implementation_status: implemented
  enabled: true
  notes: >
    Job 09 in Prompt.md, promoted to #5 in recommended execution order.
    Company-centric (configs/company_registry.yaml, CIKs verified live),
    not query-based — pulls each active company's full relevant-form
    filing history (10-K/10-Q/8-K/S-1/20-F/6-K + amendments) via the
    submissions API. A company can have more than one CIK (a redomicile
    creates a new filer identity — Zymeworks' 2022 BC-to-Delaware move is
    the confirmed live case in this registry); `ciks` is a list and each
    gets its own query_id. --since/--until filter by filing_date
    client-side; --resume reuses the prior run's --until as an implicit
    --since. Exhibits are a separate, independently versioned artifact
    (sec_exhibits.parquet, parent_record_id linking back), same pattern as
    Europe PMC's full text — only documents SEC's own filing index types
    EX-* count as exhibits, not every non-primary file in the directory
    (GRAPHIC/XBRL support files are excluded); exhibit acquisition runs
    regardless of whether the primary filing document itself succeeded.
    Requires SEC_CONTACT_EMAIL to be configured — refuses to run without a
    real contact per SEC's fair access policy.

fda:
  source_type: regulatory
  authority: primary
  official_url: https://www.fda.gov/
  api_docs_url: https://open.fda.gov/apis/
  acquisition_method: api
  authentication_required: false
  rate_limit: "openFDA: 240 req/min either way; 1,000 req/day without a key, 120,000 req/day with one (FDA_API_KEY, optional)"
  license_or_access_note: Public regulatory documents.
  raw_formats: [json, pdf, html]
  update_strategy: incremental_by_submission_status_date
  implementation_status: implemented
  enabled: true
  notes: >
    Job 10 in Prompt.md, promoted to #6 in recommended execution order.
    Covers currently FDA-*approved* ADC products via Drugs@FDA: product
    identity (brand name, active ingredient, sponsor), full regulatory
    submission history, and the actual documents (labels, approval
    letters, review documents). Does NOT yet cover Drug Safety
    Communications or products submitted/reviewed but never approved
    (no structured label exists for those, so this discovery mechanism
    can't find them) — Prompt.md's "reviewed"/"safety communications"
    scope for non-approved products is a separate future extension, not
    yet built. Discovery is NOT a manually maintained ADC drug list
    (explicitly prohibited by Prompt.md section 14) — it's full-text
    search over openFDA's own structured label text
    (configs/fda_queries.yaml) for "antibody-drug conjugate", verified
    live to catch all 15 major FDA-approved ADCs (FDA's structured
    pharm_class tags are NOT reliably populated for ADCs). Each
    discovered application_number is reconciled against
    /drug/drugsfda.json; three independent levels each get their own
    content-version manifest (fda_applications.parquet — the complete
    raw record including product/sponsor identity;
    fda_submissions.parquet; fda_documents.parquet), mirroring SEC's
    company -> filing -> exhibit model one level deeper since
    Drugs@FDA's data model genuinely has three parts. Unlike SEC's CIK,
    application_number is itself a discovery outcome (from the label
    search) rather than a curated identifier, so a label match that
    fails to reconcile still leaves durable discovery provenance
    (fda_applications_discovery.parquet) — the reconciliation outcome
    (success/not_found/failed) is tracked separately and never erases
    the discovery fact. --resume was built failure-safe from the start
    (unconditionally-advancing cursor + unresolved-backlog union +
    fresh-priority under --limit), applying the design Job 05 (SEC)
    needed 3 review rounds to arrive at, proactively rather than waiting
    to be caught on it again.

ema:
  source_type: regulatory
  authority: primary
  official_url: https://www.ema.europa.eu/
  api_docs_url: null
  acquisition_method: bulk_download
  authentication_required: false
  rate_limit: "unspecified; enforces a cumulative session-level throttle regardless of pacing (1 req/s used)"
  license_or_access_note: Public EPAR documents; no stable REST API, uses bulk JSON data exports intended for automated systems.
  raw_formats: [pdf, json]
  update_strategy: incremental_by_last_updated_date
  implementation_status: implemented
  enabled: true
  notes: >
    Job 11 in Prompt.md, promoted to #7 in recommended execution order.
    Discovery via systematic INN-suffix matching (vedotin, emtansine,
    deruxtecan, ...) against EMA's bulk medicines JSON feed
    (configs/ema_adc_substance_patterns.yaml) — not a manual drug list,
    same spirit as Job 06 (FDA). Three levels: ema_bulk.parquet (the raw
    bulk feeds themselves, preserved exactly as downloaded, for full
    reproducibility of discovery decisions), ema.parquet (medicine
    identity, the medicine's own record verbatim, authorisation/
    withdrawal dates), and ema_documents.parquet (EPAR documents as an
    independent artifact, same pattern as SEC's exhibits/FDA's
    documents) discovered from EMA's bulk EPAR-documents JSON feed for
    every ADC-candidate medicine every run, independent of medicine-level
    --limit/--resume scope. --resume for medicines built failure-safe
    from the start using the design established by Jobs 05/06. Safety-
    specific PSUSA/DHPC feeds are a known coverage gap, not yet acquired.

patents_wipo:
  source_type: patent
  authority: international
  official_url: https://ops.epo.org/ (EPO Open Patent Services — WIPO PATENTSCOPE itself has no public API and its Terms of Use forbid automated/bulk access, verified live)
  api_docs_url: https://developers.epo.org/ops-v3-2/documentation
  acquisition_method: api
  authentication_required: "yes — OAuth2 client-credentials (OPS_CONSUMER_KEY/OPS_CONSUMER_SECRET), free registration"
  rate_limit: "search endpoint has a tight short-window quota bucket (verified live: exhausted after ~15-20 calls, recovers in ~1-2 min); biblio fetch (retrieval bucket) has ample separate headroom. Also capped at 100 results/request, 2000 total-results/query."
  license_or_access_note: EPO OPS bibliographic data (INPADOC/DOCDB), covers WO-prefixed PCT publications.
  raw_formats: [xml]
  update_strategy: "full undated discovery sweep every run (5 CQL queries); materialization skips already-successful publications by default (no OPS request) as an efficiency default — OPS data can be corrected over time, so `--refresh` opts a run into re-verifying already-successful publications periodically. See jobs/wipo/job.py docstring."
  implementation_status: implemented
  enabled: true
  notes: Job 03 in Prompt.md, promoted to #8 in recommended execution order. Job 10 (EPO, patents_epo below) also uses OPS, filtered to EP-prefixed publications, as an architecturally independent job.

patents_uspto:
  source_type: patent
  authority: national
  official_url: https://data.uspto.gov/ (Open Data Portal, Patent File Wrapper API — PatentsView shut down 2026-03-20, developer.uspto.gov decommissioned)
  api_docs_url: https://data.uspto.gov/apis
  acquisition_method: api
  authentication_required: "yes — X-API-KEY header (USPTO_API_KEY), free USPTO.gov account registration"
  rate_limit: "weekly quotas verified live: 5,000,000 metadata retrievals, 1,200,000 document retrievals; a short-window HTTP 429 was observed during rapid successive calls despite the generous weekly ceiling"
  license_or_access_note: USPTO Open Data Portal (Patent File Wrapper), public disclosure.
  raw_formats: [json, pdf]
  update_strategy: "full undated discovery sweep every run (5 free-text queries); every discovered application is refetched and hash-compared every run (application content is mutable — prosecution status/assignments/continuity data genuinely change over time, unlike Job 08/WIPO); SPEC documents are skipped once successfully fetched (identity-based, not hash-based — USPTO's document endpoints dynamically re-render bytes on every request, verified live)."
  implementation_status: implemented
  enabled: true
  notes: Job 04 in Prompt.md, promoted to #9 in recommended execution order.

patents_epo:
  source_type: patent
  authority: regional
  official_url: https://ops.epo.org/ (EPO Open Patent Services — same mechanism as Job 08/WIPO, filtered to EP-prefixed publications instead of WO-prefixed)
  api_docs_url: https://developers.epo.org/ops-v3-2/documentation
  acquisition_method: api
  authentication_required: "yes — OAuth2 client-credentials (OPS_CONSUMER_KEY/OPS_CONSUMER_SECRET), same free-registration account Job 08 uses"
  rate_limit: "same OPS account/quota behavior as Job 08/WIPO — search endpoint has a tight short-window quota bucket, biblio fetch (retrieval bucket) has ample separate headroom. Also capped at 100 results/request, 2000 total-results/query."
  license_or_access_note: EPO OPS bibliographic data (INPADOC/DOCDB), covers EP-prefixed publications.
  raw_formats: [xml]
  update_strategy: "full undated discovery sweep every run (5 CQL queries); materialization skips already-successful publications by default (no OPS request) as an efficiency default, same design as Job 08/WIPO (same underlying OPS/DOCDB backend, confirmed live to behave identically) — `--refresh` opts a run into re-verifying already-successful publications periodically. See jobs/epo/job.py docstring."
  implementation_status: implemented
  enabled: true
  notes: Job 05 in Prompt.md, promoted to #10 in recommended execution order. Architecturally independent from Job 08/WIPO (own query_id/provenance namespace), sharing only the OPS client/parser (adc_acquisition/ops_client.py, adc_acquisition/ops_parser.py).

company_pipeline:
  source_type: corporate
  authority: self_reported
  official_url: null
  api_docs_url: null
  acquisition_method: scrape
  authentication_required: false
  rate_limit: "0.5 req/s default, conservative (no documented rate limit for any registered company domain)"
  license_or_access_note: Public pipeline pages; shared configs/company_registry.yaml (also used by Job 05/SEC).
  raw_formats: [html, pdf, json]
  update_strategy: "every registered (company, pipeline_url) pair refetched and hash-compared every run (no skip-by-default); no discovery ledger (pipeline_urls are curated, not discovered, same as SEC's CIK level)"
  implementation_status: implemented
  enabled: true
  notes: >
    Job 07 in Prompt.md, promoted to #11 in recommended execution order.
    Live-verified 2026-08-14: Seagen/ImmunoGen/Mersana have no standalone
    pipeline page (fully absorbed into acquirers or a new acquirer,
    tracked there instead); AbbVie's pipeline page is behind an active
    Cloudflare JS challenge, recorded as a normal logged failure rather
    than bypassed (Prompt.md prohibits CAPTCHA/bot-challenge bypassing).

company_press_release:
  source_type: corporate
  authority: self_reported
  official_url: null
  api_docs_url: null
  acquisition_method: scrape
  authentication_required: false
  rate_limit: "0.5 req/s default per company, conservative (no documented rate limit for any registered IR newsroom domain)"
  license_or_access_note: Official company domains only; shared configs/company_registry.yaml (also used by Job 05/SEC and Job 11/company pipeline pages).
  raw_formats: [html, pdf]
  update_strategy: "discovery walks each company's press-release listing pagination, stopping once a page contributes zero not-yet-resolved items (an incremental efficiency optimization, not a date filter -- --since/--until filter which of the already-discovered releases get MATERIALIZED this run, client-side, by the listing page's own release date); materialization skips already-successful releases by default (no request) as an efficiency default, same OPS/WIPO/EPO-derived design -- `--refresh` opts a run into re-verifying already-successful releases AND disables the discovery early-stop (otherwise nothing would be left to reverify). See jobs/company_press_release/job.py docstring."
  implementation_status: implemented
  enabled: true
  notes: >
    Job 08 in Prompt.md, promoted to #12 in recommended execution order.
    "Separate this from company pipeline pages" (Prompt.md) -- acquires
    each company's own discrete, dated announcements rather than a
    current-state snapshot; genuinely needs a discovery ledger (unlike
    Job 11's curated pipeline_urls) since individual releases behind a
    company's press_release_url are a discovery outcome, not a curated
    URL. No unified API exists across companies (same "fundamentally
    different from database APIs" framing as Job 11) -- live-verified
    2026-08-17 that registered companies' listing pages reduce to 3
    reused third-party IR-platform templates
    (configs/company_registry.yaml's press_release_template field,
    jobs/company_press_release/parser.py). "Only official company
    domains... do not mix media reports" enforced at discovery time via
    an official_domain membership check on every listing item. Zymeworks'
    entire ir.zymeworks.com subdomain is currently unreachable (confirmed
    live: a direct request times out, distinct from a bot-detection
    block) -- recorded as a normal logged failure, not bypassed.

patent_bioactivity_corpus:
  source_type: derived
  authority: primary
  official_url: https://ops.epo.org/ (same EPO OPS account Jobs 08/10 use, description/claims endpoints)
  api_docs_url: https://developers.epo.org/ops-v3-2/documentation
  acquisition_method: api
  authentication_required: "yes — OAuth2 client-credentials (OPS_CONSUMER_KEY/OPS_CONSUMER_SECRET), same free-registration account Jobs 08/10 use"
  rate_limit: "shares the `retrieval` bucket with biblio fetches (verified live, no separate fulltext bucket); EPO's OPS free tier separately caps at 4GB/WEEK of data across ALL OPS usage -- full-text documents are far larger than biblio XML, see result.notes for per-run byte totals"
  license_or_access_note: "Second-pass job; candidates read from Job 08 (WIPO)'s wipo.parquet AND Job 10 (EPO)'s epo.parquet, NOT a new discovery search. EPO OPS full-text data (description/claims); WIPO and EPO publications both attempted, per-authority coverage is empirical (see report)."
  raw_formats: [xml]
  update_strategy: "no discovery ledger (candidates come from already-materialized upstream manifests, not a live query, same reasoning as Crossref/SEC's CIK level); materialization skips already-successful artifacts by default (no request) as an efficiency default, same OPS/WIPO/EPO-derived design -- `--refresh` re-verifies already-successful artifacts; a 404 (`not_available`, OPS confirms no full text exists) is retried on every ordinary run, NOT treated as permanently terminal."
  implementation_status: implemented
  enabled: true
  notes: >
    Job 13 in Prompt.md, promoted to #13 in recommended execution order.
    "Should NOT search the entire patent universe again" (Prompt.md) --
    reads publication_number candidates directly from Job 08's
    wipo.parquet AND Job 10's epo.parquet. ROUND-1 FIX (2026-08-18): the
    initial version excluded WIPO entirely, generalizing from one 404'd
    WO publication to "OPS full text is EP-only" -- EPO's own OPS
    documentation lists full-text availability across multiple
    authorities including WO, so that was an overreach from n=1. WIPO
    candidates are now attempted exactly like EPO candidates; per-
    authority coverage (success/not_available per upstream_source) is
    now an empirical result of this job's own attempts, reported
    separately per authority, not an assumption baked into which
    manifests get read. USPTO (Job 09) is still not duplicated here:
    its already-acquired SPEC-type documents already bundle
    description + claims + abstract for the original filing.

publication_bioactivity_corpus:
  source_type: derived
  authority: primary
  official_url: https://unpaywall.org/ (Unpaywall API, https://unpaywall.org/products/api)
  api_docs_url: https://unpaywall.org/products/api
  acquisition_method: api
  authentication_required: "no API key -- just a real-looking contact email query param (UNPAYWALL_CONTACT_EMAIL); placeholder addresses like test@example.com are rejected with HTTP 422 (verified live)"
  rate_limit: "documented 100,000 calls/day; no per-second limit documented, we use a conservative 2 req/s for the Unpaywall lookup itself, plus a separate 0.5 req/s limiter for the arbitrary publisher/repository hosts the actual content is fetched from"
  license_or_access_note: "Second-pass job; candidates read from Job 01 (pubmed.parquet), Job 02 (europe_pmc.parquet), and Job 04 (crossref.parquet), NOT a new discovery search. Unpaywall-identified legal open-access copies (by doi) or direct Europe PMC full text (by pmcid) only -- publisher paywalls are never bypassed."
  raw_formats: [html, pdf, xml]
  update_strategy: "no discovery ledger (candidates come from already-materialized upstream manifests, same reasoning as Crossref/Job 13); materialization skips already-successful records by default (no request) -- `--refresh` re-verifies the full acquisition path; `not_available` (no OA copy / doi or pmid unknown to the relevant lookup) is retried on every ordinary run, NOT treated as permanently terminal."
  implementation_status: implemented
  enabled: true
  notes: >
    Job 14 in Prompt.md, promoted to #14 in recommended execution order.
    Researched before coding (avoiding Job 13's "generalize from n=1"
    mistake): Job 02 (Europe PMC) only fetches full text for records ITS
    OWN queries discovered AND flagged is_open_access -- verified live
    that this repo's real europe_pmc_fulltext.parquet has 0 rows, so
    nothing has been acquired that way yet. Unpaywall's coverage is
    empirically NOT a subset of Europe PMC's OA subset (covers DOIs
    Job 02 never discovered, and DOIs where Europe PMC's own
    is_open_access flag is false but a legal OA copy exists elsewhere).
    Round-1 fix: the initial version only ever looked at each record's
    doi field, silently dropping every PubMed/Europe PMC record with a
    PMID/PMCID but no DOI -- verified live this was NOT a theoretical
    edge case (8/20 PubMed and 6/20 Europe PMC real committed records
    have no doi at all). Fixed with exact-identifier resolution
    (doi > pmcid > pmid priority): a pmcid-only record is fetched
    directly from Europe PMC's own fullTextXML endpoint; a pmid-only
    record is resolved via NCBI's PMC ID Converter (exact lookup, not a
    search) before falling back to not_available. "known ADC
    aliases"-driven discovery stays deferred to Job 15 -- this job never
    searches by alias. Also fixed: within one OA location, a blocked
    url_for_pdf now falls back to that SAME location's
    url_for_landing_page before moving to a different location (a
    landing page can serve full text as HTML even when its PDF link
    blocks a bot); not_available's recorded http_status is now truthful
    (404 only for a genuine lookup-level 404, 200 with a distinct error
    value when a lookup succeeded but confirmed no usable OA copy, no
    fabricated status for an unresolvable pmid). Also self-caught live
    (before any of this reached a PR): NCBI's ID Converter JSON response
    encodes pmid as an int, not the string this job sent, which would
    have silently made every successful resolution look unresolved --
    fixed to key results by the response's own requested-id field.
    Excludes pmcids Job 02 already has resolved full text for (checked
    empirically every run, directly by pmcid), the same
    don't-duplicate-an-existing-job's-work precedent as Job 13's USPTO
    exclusion. DOIs are normalized (stripped + lowercased) before
    becoming a candidate identity -- caught live against this repo's own
    committed data that PubMed and Crossref can record the identical
    work's DOI in different casing (DOIs are case-insensitive by spec),
    which would otherwise fetch/store the same OA article twice. Live-
    verified end-to-end against this repo's own real committed
    pubmed.parquet/europe_pmc.parquet/crossref.parquet (58 upstream
    mentions, 38 unique candidate records: 24 doi-addressable, 0
    pmcid-addressable, 14 pmid-only -- all 14 confirmed unresolvable by
    NCBI's own ID Converter for these older pre-DOI-era papers): 3
    success, 34 not_available, 1 failed (a Wiley landing page 403),
    stable skip-by-default confirmed on rerun.

known_adc_asset_expansion:
  source_type: derived
  authority: primary
  official_url: null
  api_docs_url: null
  acquisition_method: api
  authentication_required: false
  rate_limit: "inherits each invoked source job's own rate limiter (PubMed/Europe PMC/WIPO/EPO/ClinicalTrials.gov) -- this job makes no requests of its own"
  license_or_access_note: "Asset-centric expansion pass -- generates source-specific searches from a curated known-ADC asset registry (configs/known_adc_assets.yaml) and executes them by calling Jobs 01/02/03/08/10 in-process. Has NO content manifest of its own; every record lands in those jobs' own manifests."
  raw_formats: []
  update_strategy: "no discovery ledger or content manifest of its own -- every sub-job invocation uses that job's OWN skip-by-default/checkpoint/versioning behavior unchanged; this job's own --resume is a no-op (always considers the full active asset registry), and a sub-job's resume cursor (last_success_max_date) is explicitly restored after each call so an asset-expansion run never silently corrupts the broad-discovery pass's own incremental window."
  implementation_status: implemented
  enabled: true
  notes: >
    Job 15 in Prompt.md, promoted to #15 (final) in recommended execution
    order. Prompt.md's own framing: Jobs 01-14 are the broad DISCOVERY
    PASS; this is the separate ASSET-CENTRIC EXPANSION PASS ("do not
    conflate the two passes"). Generates Prompt.md's 8 query templates
    ("<name>", "<alias>", "<name>" patent/trial/activity/cytotoxicity/
    xenograft/IC50) translated into each source's own real query syntax
    -- the 6 suffix templates apply ONLY to PubMed/Europe PMC (disclosed:
    WIPO/EPO's searchable title/abstract fields essentially never contain
    experimental-data language like "xenograft"/"IC50", which lives in
    the full specification text Job 13 already acquires separately);
    WIPO/EPO get every bare identifier instead. ClinicalTrials.gov (Job
    03) is driven entirely through its existing --intervention lookup
    (built during Job 03 specifically anticipating this job). Crossref
    (Job 04) is deliberately not a target (its free-text search is
    unusable for precise discovery, already established live).
    Architecturally unique in this repo: no content-version manifest of
    its own -- building one would duplicate the checkpointing/versioning
    those 5 jobs already have fully hardened. Self-caught before this job
    was ever run for real: since it calls those SAME job classes (sharing
    their checkpoint files), naively invoking them would silently advance
    the broad-discovery pass's own resume cursor forward on every
    asset-expansion run -- fixed by snapshotting and restoring each
    sub-job's last_success_max_date after the call. Also self-caught live:
    EPO OPS's search endpoint returns HTTP 404 (not an empty 200) for a
    query with genuinely zero hits -- the first queries in this codebase
    specific enough to hit that path -- fixed in the shared
    adc_acquisition/ops_client.py (benefits Jobs 08/10 too). Live-verified
    end-to-end against this repo's own real committed manifests using a
    2-asset verification subset (trastuzumab deruxtecan, brentuximab
    vedotin -- the real committed configs/known_adc_assets.yaml has 15
    assets; a full production run generates substantially more queries
    and was intentionally not run in full this round to bound API/OPS
