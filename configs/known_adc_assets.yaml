# Known-ADC asset registry (Job 15, Prompt.md section 19).
#
# Curated, not discovered — Prompt.md's own framing is "another acquisition
# loop [that] should operate from known asset names," i.e. this list IS the
# input, not an output of Jobs 01-14's broad discovery pass. Each entry is a
# real, publicly documented antibody-drug conjugate (FDA-approved or in late
# clinical development); `aliases` holds brand/trade names, `dev_codes` holds
# sponsor development codes — kept in separate fields since literature/
# patents often use only the dev code, never the eventual brand name (or
# vice versa for older assets), and both need their own query provenance.
#
# asset_id must be a stable, lowercase, underscore-separated slug — it seeds
# every query_id this job generates (Prompt.md section 20: query_ids must be
# stable and traceable), so do not rename an asset_id once queries have been
# run against it; add a new entry instead if a genuine rename is needed.
#
# ambiguous_identifiers (optional): identifiers that are ALSO a common
# English word or a real person's surname, confirmed via a live external
# benchmark audit (reports/validation/nar_adcdb_comparison.md section 11 --
# "Polivy" collided with a real eating-behavior researcher's surname in
# PubMed/Europe PMC abstract text AND a real USPTO inventor's surname,
# producing 41 confirmed false-positive records across 3 sources from one
# bare-identifier query). An identifier listed here is NEVER searched
# standalone (see query_templates.py) -- it's always qualified with the
# asset's own canonical_name to disambiguate.
#
# dev_codes/aliases below were cross-checked against the NAR ADCdb
# benchmark's own Synonyms field (same audit) and extended with
# high-literature-value forms NAR records that this registry was missing
# -- NAR's own internal accession IDs (its "DRG0xxxxxxx" ADC IDs) and
# overly generic/ambiguous short codes (e.g. bare "INO", "MIRV" -- both of
# which are themselves common words/acronyms in unrelated fields) were
# deliberately NOT added, to avoid introducing a second Polivy-class
# collision.

assets:
  - asset_id: gemtuzumab_ozogamicin
    canonical_name: Gemtuzumab ozogamicin
    aliases: [Mylotarg]
    dev_codes: [CMA-676, WAY-CMA-676]
    target: CD33
    company: Pfizer
    active: true

  - asset_id: brentuximab_vedotin
    canonical_name: Brentuximab vedotin
    aliases: [Adcetris]
    dev_codes: [SGN-35, SGN-30, cAC10-vcMMAE]
    target: CD30
    company: Seagen
    active: true

  - asset_id: trastuzumab_emtansine
    canonical_name: Trastuzumab emtansine
    aliases: [Kadcyla]
    dev_codes: [T-DM1, Trastuzumab-DM1, Herceptin-DM1]
    target: HER2
    company: Genentech
    active: true

  - asset_id: inotuzumab_ozogamicin
    canonical_name: Inotuzumab ozogamicin
    aliases: [Besponsa]
    dev_codes: [CMC-544, PF-05208773]
    target: CD22
    company: Pfizer
    active: true

  # Moxetumomab pasudotox (Lumoxiti, CAT-8015) is EXCLUDED from this
  # strict-ADC registry -- NCI's own drug dictionary classifies it as a
  # recombinant IMMUNOTOXIN (an anti-CD22 antibody Fv fused to a
  # Pseudomonas exotoxin A fragment, PE38), not a classic
  # antibody-linker-payload conjugate. Kept here (inactive) for
  # provenance rather than deleted outright, since it's a real,
  # historically significant CD22-targeted biologic worth tracking if
  # this registry's scope is ever widened to include immunotoxins.
  - asset_id: moxetumomab_pasudotox
    canonical_name: Moxetumomab pasudotox
    aliases: [Lumoxiti]
    dev_codes: [CAT-8015]
    target: CD22
    company: AstraZeneca
    active: false

  - asset_id: polatuzumab_vedotin
    canonical_name: Polatuzumab vedotin
    aliases: [Polivy]
    dev_codes: [DCDS4501A, DCDS4501S, RG7596]
    target: CD79b
    company: Genentech
    # "Polivy" is ALSO the surname of a real, prolific researcher (Janet
    # Polivy, eating-behavior/restraint-scale research) and a real named
    # inventor on unrelated USPTO patents (Daniel J. Polivy, Microsoft) --
    # both confirmed live via this repo's NAR ADCdb benchmark audit. See
    # module header comment above.
    ambiguous_identifiers: [Polivy]
    active: true

