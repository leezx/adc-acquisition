# Conference abstract corpus query registry (BREADTH_PLAN.md Phase 4, Part 6).
#
# Unlike every other *_queries.yaml in this repo, these two "queries" do NOT
# describe a live, per-run search this job executes itself. AACR/ASCO have no
# public search API this project accesses directly; the underlying abstract
# metadata was already fetched (via Crossref, keyed by each meeting's DOI
# prefix) and filtered by an ADC-keyword regex by a separate, external
# workflow (REPOS/aacr-abstract-workflow, outside both this repo and the
# adc-acquisition Claude Code project). This job reuses that already-computed
# local historical corpus (Part 6: "search this project and local data for
# reusable historical corpora before any new download") rather than
# re-implementing a second AACR/ASCO scraper.
#
# query_text below is the FULL, VERBATIM filter logic actually run, read
# directly out of the external workflow's own source (not summarized, not
# truncated with "...") -- because adc-acquisition never re-executes this
# filter itself, this registry is the ONLY record inside this repo of why
# these records are in the corpus at all; if it's incomplete, the selection
# semantics for 1,286+1,170 records become unreconstructable the moment the
# external workflow's own history is unavailable. Both filters are
# deliberately declared broad-discovery queries for Phase 1's locked
# provenance definition: neither depends on configs/known_adc_assets.yaml,
# both are pure ADC-terminology matches over an otherwise-unfiltered set of
# conference abstracts.
#
# ROUND-1 FIX: the initial version of this registry (a) truncated the ASCO
# regex with "...", and (b) mischaracterized AACR's exclusion step as a
# "manual exclusion pass" (copying extraction_report.json's own
# curation_note wording) when it is actually a second, fully deterministic
# regex (TITLE_EXCLUDE_RE below) -- verified by reading is_adc_record() in
# both extract_aacr_annual_adc.py (2016-2025) and extract_aacr2026_adc.py
# (2026), which apply the byte-identical TITLE_INCLUDE_RE/TITLE_EXCLUDE_RE
# pair. This is a correction to how faithfully this file transcribes an
# unchanged external filter, not a change to the filter itself -- no
# query_version bump (the rule below still applies to a genuine change in
# what the external workflow computes).
#
# If the external workflow's filter logic is ever re-run with a materially
# different regex/scope, bump query_version and mint a new query_id -- same
# rule as every other registry in this repo -- so historical manifests stay
# interpretable even though this job doesn't execute the filter itself.

queries:
  - query_id: CONFERENCE_AACR_001
    query_version: 1
    query_text: >-
      TITLE-ONLY, two-regex deterministic filter (no manual step) against
      Crossref-sourced AACR Annual Meeting abstract metadata (2016-2025)
      and AACR 2026 proceedings PDF text (2026, pre-Crossref-indexing).
      A record is included iff TITLE_INCLUDE_RE matches its title AND
      TITLE_EXCLUDE_RE does NOT match its title (both case-insensitive).
      TITLE_INCLUDE_RE = /\bADC\b|ADCs|antibody[- ]drug conjugate|bsADC|
      iADC|biparatopic ADC|dual-payload ADC|trastuzumab deruxtecan|T-DXd|
      Dato-DXd|datopotamab deruxtecan|sacituzumab govitecan|sac-TMT|
      enfortumab vedotin|EV-resistance|raludotatug deruxtecan|
      micvotabart pelidotin|Teliso-V|deruxtecan|govitecan|vedotin|
      pelidotin/. TITLE_EXCLUDE_RE = /peptide drug conjugate|
      protein-drug conjugate|polymer-drug conjugate|tumor targeting
      peptide drug conjugate/. Verified byte-identical between
      REPOS/aacr-abstract-workflow/scripts/extract_aacr_annual_adc.py
      (2016-2025) and extract_aacr2026_adc.py (2026); reused here as an
      already-materialized snapshot, not re-run by this job.
    purpose: >-
      KNOWN LIMITATION (disclosed, not fixed this phase): this filter only
      matches the abstract TITLE, not the abstract body -- narrower than
      this repo's own PubMed/Europe PMC [tiab] (title+abstract) queries.
      An AACR abstract that discusses an ADC substantively without the
      matched terms in its own title will not be in this corpus at all,
      and this job cannot recover it (the filtering already happened
      upstream, outside this job's control).
    active: true

  - query_id: CONFERENCE_ASCO_001
    query_version: 1
    query_text: >-
      TWO-STAGE deterministic pipeline against Crossref-sourced ASCO
      Annual Meeting records. STAGE 1 (candidate fetch, per year
      2016-2026): Crossref works API query.title=<term>, filter=
      from-pub-date:<year>-01-01,until-pub-date:<year>-12-31,
      prefix:10.1200, for term in CORE_QUERY_TERMS = ["antibody-drug
      conjugate", "antibody drug conjugate", "ADC", "ADCs"]; EXPANDED_
      QUERY_TERMS = ["vedotin","deruxtecan","govitecan","emtansine",
      "mafodotin","tesirine","duocarmazine","maytansinoid","auristatin",
      "topoisomerase inhibitor payload"] are ALSO searched only if the
      external workflow's ASCO_ADC_EXPANDED=1 env var was set at build
      time -- NOT VERIFIABLE now which setting produced this corpus,
      disclosed as an unresolved provenance gap rather than assumed
      either way. STAGE 2 (actual inclusion filter, applied to every
      Stage-1 candidate item): doi must match JCO_ANNUAL_RE = /10\.1200/
      jco\.(20\d{2})\.\d+\.(?:15|16)_suppl\./ (an Annual Meeting
      abstract, not a regular JCO article) AND "{title} {abstract}"
      must match ADC_RE = /\b(antibody[-\s]?drug conjugates?|ADCs?|
      vedotin|deruxtecan|govitecan|emtansine|mafodotin|tesirine|
      duocarmazine|maytansinoid|auristatin|MMAE|MMAF|DM1|DM4|DXd|SN-38|
      exatecan|payload|linker)\b/ (case-insensitive; no exclude regex).
      Computed externally by
      REPOS/aacr-abstract-workflow/scripts/download_asco_adc_abstracts.py;
      reused here as an already-materialized snapshot, not re-run by
      this job.
    purpose: >-
      Stage 2's ADC_RE is broader than the AACR filter above (title+
      abstract, not title-only, and a wider term list including payload/
      linker/DM1/DM4/MMAE/MMAF) -- closer in shape to this repo's own
      PubMed/Europe PMC broad queries. But Stage 1's Crossref candidate
      fetch is itself a title-only search restricted to (by default)
      4 core terms, so an ASCO abstract whose TITLE contains none of
      those 4 terms could in principle never reach Stage 2 even if its
      abstract text would pass ADC_RE -- a real, disclosed recall
      ceiling this job did not verify empirically (would require
      re-running Stage 1 against Crossref, out of this phase's scope).
    active: true
