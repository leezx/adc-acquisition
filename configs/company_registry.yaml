# Company registry (Job 05 — SEC EDGAR).
#
# Prompt.md section 13: "Maintain a company -> CIK registry." Start with a
# curated list rather than attempting to enumerate every possible filer
# (Prompt.md section 11 makes the same recommendation for company pipeline
# pages: "Start with a curated company registry rather than attempting
# unrestricted web crawling").
#
# CIKs verified live against SEC's own lookup services on 2026-08-11:
# https://www.sec.gov/files/company_tickers.json (currently-listed filers)
# and https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany (retains
# delisted/acquired filers' historical CIKs indefinitely).
#
# A company can have MORE THAN ONE CIK: a name change alone keeps the same
# CIK (SEC records it under `formerNames`, e.g. Seagen/"Seattle Genetics"),
# but a corporate redomicile/reincorporation creates a brand-new SEC filer
# identity with its own CIK and its own filing history. Confirmed live on
# 2026-08-11 (checked every company below via its submissions API's
# `formerNames`) that Zymeworks is the only case in this registry: it
# redomiciled from British Columbia to Delaware in 2022, so its full
# pre-2022 history (including any ADC platform/partnership disclosures from
# that period) lives under a different, predecessor CIK. `ciks` is always a
# list — single-CIK companies just have a one-item list — so every filing's
# query_id can carry which specific filer entity it came from.
#
# company_id is a short stable slug used to build this company's query_id
# in the SEC job (e.g. "seagen" CIK 0001060736 -> query_id
# "SEC_FILINGS_SEAGEN_0001060736"). Do not rename an existing company_id
# once records reference it.
#
# EXTENDED for Job 11 (company pipeline pages, Prompt.md section 11) and
# Job 12 (company press releases, Prompt.md section 12) on 2026-08-14/17:
# official_domain/pipeline_urls/investor_relations_url/press_release_url/
# press_release_template, per the SAME Company entries SEC already uses
# (Prompt.md's own section 11 names the registry file identically to
# SEC's) — see adc_acquisition/company_registry.py for why one shared
# dataclass, not a second competing registry. Live-verified 2026-08-14
# (plain requests + a descriptive User-Agent, same technique already used
# for fda.gov's bot detection): a company acquired/delisted can still have
# NO standalone pipeline page at all (its former assets appear only in the
# acquirer's own pipeline page instead) -- `pipeline_urls: []` for those,
# not a guessed/broken URL. `active` continues to mean "still worth
# tracking historically" (as SEC already uses it) -- it does NOT mean
# "has a pipeline page"; that's simply an empty pipeline_urls list.
#
# `press_release_template` (added 2026-08-17, Job 12): each company's IR
# newsroom is a bespoke site with its own listing-page HTML structure and
# pagination scheme -- no shared API exists across companies (same
# "fundamentally different from database APIs" framing Prompt.md gives
# pipeline pages). Live-verified 2026-08-17 that these fall into a small
# number of REUSED third-party IR-platform templates rather than each
# being genuinely unique:
#   - "workiva_ir_newsroom": <li class="wd_item"> listing items,
#     offset-based `?o=N` pagination (ADC Therapeutics, AbbVie -- byte-
#     identical template between the two, confirmed live).
#   - "q4_ir_media": <article class="media"> listing items with an ISO
#     `datetime` attribute, 1-indexed `?page=N` pagination (Sutro
#     Biopharma).
#   - "pfizer_drupal_newsroom": Pfizer's own Drupal-based newsroom,
#     0-indexed `?page=N` pagination -- a genuinely one-off template, not
#     shared with any other registered company.
# See jobs/company_press_release/parser.py for the per-template parsers
# this field selects between.
#
# `presentations_url`/`presentations_template` (added 2026-08-24,
# BREADTH_PLAN.md Phase 5 Part 7 -- company scientific-presentation
# source): distinct from `press_release_url` -- an IR newsroom covers
# corporate announcements, this covers actual scientific congress
# presentations/posters (AACR/ASCO/ESMO/ASH/etc.), which is often hosted
# on a SEPARATE page or even a separate domain from the press-release
# feed (confirmed live 2026-08-24: ADC Therapeutics' scientific
# presentations live on adctmedical.com, a distinct medical-affairs
# microsite, not adctherapeutics.com or ir.adctherapeutics.com -- see
# jobs/company_scientific_presentations/job.py for why its own-domain
# check is anchored to `presentations_url`'s own host, not
# `official_domain`). Only registered for companies where a real,
# scrapable listing with genuine congress-presentation content was found
# live -- NOT attempted for every company (see that job's report for
# which companies were checked and found to have no such page: AbbVie's
# main domain is behind the same Cloudflare challenge documented above
# for its pipeline page and no separate public microsite was found;
# Pfizer has no distinct presentations archive, only stale 2018-2020
# press-kit assets; Seagen/ImmunoGen/Mersana are acquired/absorbed with
# no standalone page, same as their pipeline/press-release situation).
# Templates:
#   - "adctmedical_congress_listing": a single unpaginated page (~115
#     items, all loaded at once, confirmed live) of `<div class='pub_row
#     ...'>` blocks, each linking DIRECTLY to a PDF poster/slide-deck file
#     (no separate HTML detail page) -- no per-item date beyond the
#     congress year, preserved via the extra `congress` field ("ASH
#     2025") rather than fabricated into a false-precision date.
#   - "sutro_divi_blog": a Divi-theme (Elegant Themes) WordPress blog
#     loop, `<article id="post-N" ...>` items with a clean `entry-title`/
#     `post-meta published` date, standard `/page/N/` pagination --
#     confirmed live that pages past the real end return zero matching
#     items (a static, always-present "page"-type post exists on every
#     page but does not match the entry-title pattern, so it never
#     produces a spurious item). Each item's own URL is an HTML detail
#     page (not a direct PDF) -- materialized as-is, same "don't chase
#     embedded assets one hop deeper" principle as Job 12's press-release
#     detail pages.

